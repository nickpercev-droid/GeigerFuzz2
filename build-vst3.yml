name: Build Geiger Counter Pro VST3 (Windows x64)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target GeigerCounterPro_VST3 --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Geiger-Counter-Pro-VST3-Windows-x64
          path: build/GeigerCounterPro_artefacts/Release/VST3/**
          if-no-files-found: error
          compression-level: 6
